<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>VG Music</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%234f46e5' d='M256 80C149.9 80 62.4 159.4 49.6 262c9.4-3.8 19.6-6 30.4-6c26.5 0 48 21.5 48 48V432c0 26.5-21.5 48-48 48c-44.2 0-80-35.8-80-80V256C0 114.6 114.6 0 256 0s256 114.6 256 256v144c0 44.2-35.8 80-80 80c-26.5 0-48-21.5-48-48V304c0-26.5 21.5-48 48-48c10.8 0 21 2.1 30.4 6C449.6 159.4 362.1 80 256 80z'/%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root{--p:#4f46e5;--s:#7c3aed;--w:#fff;--d:#1f2937;--g:#6b7280;--l:#e5e7eb;--r:#ef4444;--b:#f3f4f6}
        *{box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--b);color:var(--d);margin:0;padding:1rem;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .card{background:var(--w);padding:35px 20px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05);width:100%;max-width:400px}
        h1{margin:0 0 1.5rem;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--p)}
        .badge{display:inline-flex;align-items:center;gap:6px;background:var(--b);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;color:var(--g)}
        .dot{width:8px;height:8px;background:var(--r);border-radius:50%;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{transform:scale(.95);opacity:.9}50%{transform:scale(1.3);opacity:.4}}
        .icon-disp{font-size:50px;margin:10px 0 30px;color:var(--p);filter:drop-shadow(0 4px 10px rgba(79,70,229,.2))}
        .ctrls{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:25px}
        .btn{background:var(--b);border:none;width:50px;height:50px;border-radius:50%;color:var(--d);font-size:18px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
        .btn:hover{background:var(--l);transform:scale(1.05)}
        .play-btn{width:75px;height:75px;background:var(--p);color:var(--w);font-size:26px;box-shadow:0 4px 15px rgba(79,70,229,.3)}
        .play-btn:hover{background:var(--s);color:var(--w)}
        .vol{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px;font-size:14px;color:var(--g)}
        input[type=range]{-webkit-appearance:none;width:160px;height:6px;border-radius:3px;background:var(--l);outline:none}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--p);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}
        .chans{display:flex;align-items:center;justify-content:center;gap:15px;padding-top:25px;border-top:1px solid var(--l)}
        .chan{background:var(--b);border:none;width:45px;height:45px;border-radius:50%;color:var(--g);font-size:18px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
        .chan:hover{background:var(--l);color:var(--d);transform:translateY(-2px)}
        .chan.active{background:var(--p);color:var(--w);box-shadow:0 4px 10px rgba(79,70,229,.3)}
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fas fa-headphones"></i> VG Music</h1>
        <div class="badge">
            <span class="dot" id="dot" style="display:none"></span> 
            <span id="txt">Paused</span>
        </div>
        <div class="icon-disp" id="disp"><i class="fas fa-music"></i></div>
        <div class="ctrls">
            <button class="btn" id="prev"><i class="fas fa-backward-step"></i></button>
            <button class="btn play-btn" id="play"><i class="fas fa-play" id="p-icon"></i></button>
            <button class="btn" id="next"><i class="fas fa-forward-step"></i></button>
        </div>
        <div class="vol">
            <i class="fas fa-volume-low"></i>
            <input type="range" min="0" max="1" step="0.05" value="0.9" id="vol">
            <i class="fas fa-volume-high"></i>
        </div>
        <div class="chans" id="grid"></div>
    </div>

    <script>
        const st = [
            { i: "fa-music", f: "https://drive.uber.radio/uber/bollywoodworkout/icecast.audio" },
            { i: "fa-guitar", f: "https://drive.uber.radio/uber/bollywood2010s/icecast.audio" },
            { i: "fa-compact-disc", f: "https://drive.uber.radio/uber/bollywood2000s/icecast.audio" },
            { i: "fa-tape", f: "https://drive.uber.radio/uber/bollywood1990s/icecast.audio" }
        ];

        let idx = 0, isPlay = false, audio = new Audio();
        audio.preload = 'none';

        const $ = id => document.getElementById(id);
        const pIcon = $('p-icon'), disp = $('disp'), dot = $('dot'), txt = $('txt'), grid = $('grid'), vol = $('vol');
        const upUI = () => document.querySelectorAll('.chan').forEach((el, i) => el.classList.toggle('active', i === idx));

        const doPlay = () => {
            txt.textContent = "Connecting";
            dot.style.display = "none";
            audio.play().then(() => {
                isPlay = true; pIcon.className = "fas fa-pause"; txt.textContent = Live"; dot.style.display = "inline-block"; upUI();
            }).catch(() => {
                isPlay = false; pIcon.className = "fas fa-play"; txt.textContent = "Network Error"; dot.style.display = "none";
            });
        };

        const load = () => {
            disp.innerHTML = `<i class="fas ${st[idx].i}"></i>`;
            audio.src = st[idx].f;
            audio.load();
            doPlay();
        };

        st.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = `chan ${i === idx ? 'active' : ''}`;
            btn.innerHTML = `<i class="fas ${s.i}"></i>`;
            btn.onclick = () => { idx = i; load(); };
            grid.appendChild(btn);
        });

        $('play').onclick = () => {
            if (!audio.src) return load();
            if (isPlay) {
                audio.pause(); isPlay = false; pIcon.className = "fas fa-play"; txt.textContent = "Paused"; dot.style.display = "none";
            } else doPlay();
        };

        $('prev').onclick = () => { idx = (idx - 1 + st.length) % st.length; load(); };
        $('next').onclick = () => { idx = (idx + 1) % st.length; load(); };
        vol.oninput = e => audio.volume = e.target.value;
        audio.volume = vol.value;
    </script>
</body>
</html>
